services:
  db:
    image: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: jobs
    ports:
      - "5431:5432"
  db-tokens:
    image: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tokens
    ports:
      - "5430:5432"

  create-jobs-db:
    build:
      context: .
      dockerfile: Dockerfile.jobs_db
    volumes:
      - ./app_logs/:/app/app_logs
    restart: on-failure
    depends_on:
      - db
    env_file:
      - secrets/.env
  create-tokens-db:
    build:
      context: .
      dockerfile: Dockerfile.token_db
    volumes:
      - ./app_logs/:/app/app_logs
    restart: on-failure
    depends_on:
      - db-tokens 
    env_file:
      - secrets/.env

  parse-jobs-db:
    build:
      context: .
      dockerfile: Dockerfile.jobs_db_parsing
    volumes:
      - ./app_logs/:/app/app_logs
    restart: on-failure
    depends_on:
      - create-jobs-db
    env_file:
      - secrets/.env

  vacancy-status:
    build:
      context: .
      dockerfile: Dockerfile.vacancy_status_parsing
    volumes:
      - ./app_logs/:/app/app_logs
    restart: on-failure
    depends_on:
      - create-jobs-db
    env_file:
      - secrets/.env

