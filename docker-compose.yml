services:
  db:
    image: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: jobs
    ports:
      - "5431:5432"
  db-tokens:
    image: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tokens
    ports:
      - "5430:5432"

  jobs-db:
    build:
      context: .
      dockerfile: Dockerfile.jobs_db
    volumes:
      - ./:/app
    restart: on-failure
    depends_on:
      - db
  create-tokens-db:
    build:
      context: .
      dockerfile: Dockerfile.token_db
    volumes:
      - ./:/app
    restart: on-failure
    depends_on:
      - db-tokens

